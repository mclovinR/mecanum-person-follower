name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  zone-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v

  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secrets.h must never be committed
        run: test ! -e firmware/control_esp32/secrets.h
